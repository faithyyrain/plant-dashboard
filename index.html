// ===== CALENDAR FUNCTIONS =====

  function renderCalendar() {
  const calendarGrid = document.getElementById("calendarGrid");
  const calendarMonthTitle = document.getElementById("calendarMonthTitle");

  calendarGrid.innerHTML = "";

  const today = new Date();
  const year = today.getFullYear();
  const month = today.getMonth();

  const firstDayOfMonth = new Date(year, month, 1);
  const lastDayOfMonth = new Date(year, month + 1, 0);

  const monthName = today.toLocaleDateString("en-US", {
    month: "long",
    year: "numeric"
  });

  calendarMonthTitle.textContent = monthName;

  const startingWeekday = firstDayOfMonth.getDay();
  const totalDays = lastDayOfMonth.getDate();

  for (let i = 0; i < startingWeekday; i++) {
    const emptyDay = document.createElement("div");
    emptyDay.className = "calendar-day empty";
    calendarGrid.appendChild(emptyDay);
  }

  for (let day = 1; day <= totalDays; day++) {
    const date = new Date(year, month, day);

    const dateString = dateToString(date);
    const plantsDue = getPlantsDueOnDate(dateString);
    const plantsWatered = getPlantsWateredOnDate(dateString);

    const dayBox = document.createElement("div");
    dayBox.className = "calendar-day";
    dayBox.textContent = day;

    if (dateString === selectedCalendarDate) {
      dayBox.classList.add("selected-day");
    }

    if (dateString === getTodayString()) {
      dayBox.classList.add("today");
    }

    if (plantsDue.length > 0 || plantsWatered.length > 0) {
      dayBox.classList.add("has-due");

      const dotRow = document.createElement("div");
      dotRow.className = "calendar-dot-row";

      if (plantsDue.length > 0) {
        const dueDot = document.createElement("div");
        dueDot.className = "calendar-dot";
        dotRow.appendChild(dueDot);
      }
  
      if (plantsWatered.length > 0) {
        const wateredDot = document.createElement("div");
        wateredDot.className = "calendar-watered-dot";
        dotRow.appendChild(wateredDot);
      }

      const hasFertilizerDue = plantsDue.some(plant =>
        shouldShowCalendarFertilizerRing(plant, dateString)
      );

      if (hasFertilizerDue) {
        const fertilizerDot = document.createElement("div");
        fertilizerDot.className = "fertilizer-calendar-dot";
        dotRow.appendChild(fertilizerDot);
      }

      dayBox.appendChild(dotRow);

      dayBox.addEventListener("click", function(event) {
        event.stopPropagation();
        selectedCalendarDate = dateString;
        renderCalendar();
        openDuePanel(dateString);
      });
    }

    calendarGrid.appendChild(dayBox);
  }
}

// ===== PLANTS DUE / WATERED PANEL FUNCTIONS =====

  function openDuePanel(dateString) {
  const duePanel = document.getElementById("duePanel");
  const duePanelTitle = document.getElementById("duePanelTitle");
  const duePlantList = document.getElementById("duePlantList");
  const calendarPanel = document.getElementById("calendarPanel");

  const hasAlreadySelectedThisDate =
    selectedDueDate === dateString && selectedDuePlants.length > 0;

  let plantsDue;

  if (hasAlreadySelectedThisDate) {
    plantsDue = selectedDuePlants;
  } else {
    plantsDue = getPlantsDueOnDate(dateString);
    const plantsWatered = getPlantsWateredOnDate(dateString);

    if (plantsDue.length === 0 && plantsWatered.length > 0) {
      plantsDue = plantsWatered;
    }

    selectedDuePlants = [...plantsDue];
  }

  plantsDue.sort((a, b) => {
    const aNeedsFertilizer =
      hasFertilizerSchedule(a) &&
      (shouldShowCalendarFertilizerRing(a, dateString) || a.lastFertilized === dateString);

    const bNeedsFertilizer =
      hasFertilizerSchedule(b) &&
      (shouldShowCalendarFertilizerRing(b, dateString) || b.lastFertilized === dateString);

    return bNeedsFertilizer - aNeedsFertilizer;
  });

  const hasDuePlants = getPlantsDueOnDate(dateString).length > 0;
  const hasWateredPlants = getPlantsWateredOnDate(dateString).length > 0;

  if (!hasDuePlants && hasWateredPlants) {
    duePanelTitle.textContent = formatWateredPanelTitle(dateString);
  } else {
    duePanelTitle.textContent = formatDuePanelTitle(dateString);
  }

  const isTodayPanel = dateString === getTodayString();
  const isWateredOnlyPanel = !hasDuePlants && hasWateredPlants;

  const todayHasFertilizerButton = plantsDue.some(plant =>
    hasFertilizerSchedule(plant) &&
    (shouldShowCalendarFertilizerRing(plant, dateString) || plant.lastFertilized === dateString)
  );
  
  duePanel.classList.remove(
    "watered-only",
    "today-with-fertilizer",
    "today-no-fertilizer"
  );
  
  if (isWateredOnlyPanel) {
    duePanel.classList.add("watered-only");
  } else if (isTodayPanel && todayHasFertilizerButton) {
    duePanel.classList.add("today-with-fertilizer");
  } else if (isTodayPanel) {
    duePanel.classList.add("today-no-fertilizer");
  }

  duePlantList.innerHTML = "";
  selectedDueDate = dateString;

  duePanel.style.maxHeight = calendarPanel.offsetHeight + "px";

  duePanel.classList.add("open");

  plantsDue.forEach(plant => {
    const plantItem = document.createElement("div");
    plantItem.className = "due-plant-item";

    const plantPhoto = document.createElement("img");
    plantPhoto.className = "due-plant-photo";
    plantPhoto.src = versionedPlantPhoto(plant.image);
    plantPhoto.alt = plant.name;

    const plantName = document.createElement("div");
    plantName.className = "due-plant-name";
    plantName.textContent = plant.name;

    plantPhoto.addEventListener("click", function(event) {
      event.stopPropagation();

      const plantIndex = plants.indexOf(plant);

      reopenCalendarDate = dateString;

      closeDuePanel();
      openPlantDetails(plantIndex);
    });

    const actionButtons = document.createElement("div");
    actionButtons.className = "due-plant-actions";

    if (isTodayPanel) {
      const waterButton = document.createElement("button");
      waterButton.className = "due-mini-button";
      waterButton.textContent = "Water";

      if (plant.lastWatered === dateString) {
        waterButton.textContent = "Watered!";
        waterButton.classList.add("watered-active");
      }

      waterButton.addEventListener("click", function(event) {
        event.stopPropagation();
        toggleWateredForPlant(plant);
        refreshCalendarViews();
      });

      actionButtons.appendChild(waterButton);
      if (
        hasFertilizerSchedule(plant) &&
        (shouldShowCalendarFertilizerRing(plant, dateString) || plant.lastFertilized === dateString)
      ) {
        const fertilizeButton = document.createElement("button");
        fertilizeButton.className = "due-mini-button";
        fertilizeButton.textContent = "Fertilize";

        if (plant.lastFertilized === dateString) {
          fertilizeButton.textContent = "Fertilized!";
          fertilizeButton.classList.add("fertilized-active");
        }

        fertilizeButton.addEventListener("click", function(event) {
          event.stopPropagation();
          toggleFertilizedForPlant(plant);
          refreshCalendarViews();
        });

        actionButtons.appendChild(fertilizeButton);
      }
    }

    if (plant.lastWatered !== dateString && (dateString !== getTodayString() || plant.lastWatered !== getTodayString())) {
      const delayBackButton = document.createElement("button");
      delayBackButton.className = "due-mini-button delay-back-button";
      delayBackButton.textContent = "-1 Day";

      if (plant.intervalAdjustedToday === dateString) {
        delayBackButton.textContent = "Earlier!";
        delayBackButton.classList.add("earlier-active");
      }

      delayBackButton.addEventListener("click", function(event) {
        event.stopPropagation();

        const duePanel = document.getElementById("duePanel");
        const savedScrollTop = duePanel.scrollTop;

        moveWateringBackOneDayForPlant(plant, dateString);
        plant.intervalAdjustedToday = dateString;
        savePlantToFirebase(plant);

        delayBackButton.textContent = "Earlier!";
        delayBackButton.classList.add("earlier-active");

        updateMarkerColors();
        renderCalendar();
        renderUpcomingChecks();

        duePanel.scrollTop = savedScrollTop;
      });

      actionButtons.appendChild(delayBackButton);
    }

    if (plant.lastWatered !== dateString && (dateString !== getTodayString() || plant.lastWatered !== getTodayString())) {
      const delayButton = document.createElement("button");
      delayButton.className = "due-mini-button";
      delayButton.textContent = "+1 Day";

      const clickedDate = new Date(dateString + "T00:00:00");
      clickedDate.setHours(0, 0, 0, 0);

      const delayedDate = new Date(clickedDate);
      delayedDate.setDate(clickedDate.getDate() + 1);

      const delayedDateString = dateToString(delayedDate);

      if (plant.delayUntil === delayedDateString) {
        delayButton.textContent = "Delayed!";
        delayButton.classList.add("delayed-active");
      }

      delayButton.addEventListener("click", function(event) {
        event.stopPropagation();

        const duePanel = document.getElementById("duePanel");
        const savedScrollTop = duePanel.scrollTop;

        toggleDelayWateringOneDayForPlant(plant, dateString);

        updateMarkerColors();
        renderCalendar();
        renderUpcomingChecks();
        openDuePanel(dateString);

        duePanel.scrollTop = savedScrollTop;
      });

      actionButtons.appendChild(delayButton);

      if (!isTodayPanel && hasFertilizerSchedule(plant) && shouldShowCalendarFertilizerRing(plant, dateString)) {
        const fertilizerDot = document.createElement("div");
        fertilizerDot.className = "due-plant-fertilizer-dot";
        actionButtons.appendChild(fertilizerDot);
      }
    }

    const plantMain = document.createElement("div");
    plantMain.className = "due-plant-main";

    const plantInfo = document.createElement("div");
    plantInfo.className = "due-plant-info";

    plantInfo.appendChild(plantName);
    plantInfo.appendChild(actionButtons);

    plantMain.appendChild(plantPhoto);
    plantMain.appendChild(plantInfo);

    plantItem.appendChild(plantMain);

    duePlantList.appendChild(plantItem);
  });
}

// ===== UPCOMING CHECKS FUNCTIONS =====

  function renderUpcomingChecks() {
  const upcomingList = document.getElementById("upcomingList");

  upcomingList.innerHTML = "";

  const today = new Date();
  today.setHours(0, 0, 0, 0);

  const upcomingDays = [];

  for (let i = 0; i <= 3; i++) {
    const date = new Date(today);
    date.setDate(today.getDate() + i);

    const dateString = dateToString(date);
    const plantsDue = getPlantsDueOnDate(dateString);

    if (plantsDue.length > 0) {
      upcomingDays.push({
        date,
        dateString,
        plantsDue
      });
    }
  }

  if (upcomingDays.length === 0) {
    upcomingList.innerHTML = `<div class="upcoming-item">No checks due this week.</div>`;
    return;
  }

  upcomingDays.forEach(item => {
    const daysUntil = Math.round((item.date - today) / (1000 * 60 * 60 * 24));

    let label = "";

    if (daysUntil === 0) {
      label = "Today";
    } else if (daysUntil === 1) {
      label = "Tomorrow";
    } else {
      label = item.dateString.slice(5);
    }

    const upcomingItem = document.createElement("div");
    upcomingItem.className = "upcoming-item clickable-upcoming";
    upcomingItem.textContent = `${label} — ${item.plantsDue.length} plant${item.plantsDue.length === 1 ? "" : "s"}`;

    upcomingItem.addEventListener("click", function() {
      openDuePanel(item.dateString);
    });

    upcomingList.appendChild(upcomingItem);
  });
}

document.addEventListener("mousemove", function(event) {
  if (trashRestorePlant && trashRestoreGhost) {
    trashRestoreGhost.style.left = event.clientX + "px";
    trashRestoreGhost.style.top = event.clientY + "px";
  }

  if ((!movingPlant && !movingDot) || !editingPlant) {
    return;
  }

  const metrics = getImageMetrics();

  const x = event.clientX - metrics.containerRect.left;
  const y = event.clientY - metrics.containerRect.top;

  const newX = ((x - moveOffsetX - metrics.offsetX) / metrics.displayedWidth) * 100;
  const newY = ((y - moveOffsetY - metrics.offsetY) / metrics.displayedHeight) * 100;

  if (movingDot) {
    const stickerX = editingPlant.stickerX ?? editingPlant.x;
    const stickerY = editingPlant.stickerY ?? editingPlant.y;

    editingPlant.markerOffsetX = Number((newX - stickerX).toFixed(1));
    editingPlant.markerOffsetY = Number((newY - stickerY).toFixed(1));
  } else {
    editingPlant.stickerX = Number(newX.toFixed(1));
    editingPlant.stickerY = Number(newY.toFixed(1));
  }

  if (movingPlant) {
    setTrashDragHighlight(
      isPointerOverTrash(event)
    );
  } else {
    setTrashDragHighlight(false);
  }

  positionMarkers();

});

document.addEventListener("mouseup", function(event) {

  if (trashRestorePlant) {
    const restoredPlant = trashRestorePlant;

    const dragDistance = Math.hypot(
      event.clientX - trashRestoreStartX,
      event.clientY - trashRestoreStartY
    );

    const roomRect = roomContainer.getBoundingClientRect();

    const droppedInsideRoom =
      dragDistance >= 6 &&
      event.clientX >= roomRect.left &&
      event.clientX <= roomRect.right &&
      event.clientY >= roomRect.top &&
      event.clientY <= roomRect.bottom;

    if (trashRestoreGhost) {
      trashRestoreGhost.remove();
    }

    trashRestorePlant = null;
    trashRestoreGhost = null;
    trashRestoreStartX = 0;
    trashRestoreStartY = 0;

    if (!droppedInsideRoom) {
      const trashPanel =
        document.getElementById("trashPanel");

      if (trashPanel && editMode) {
        trashPanel.classList.add("open");
      }

      renderTrashDrawer();
      return;
    }

    const metrics = getImageMetrics();

    const cursorX =
      event.clientX - metrics.containerRect.left;

    const cursorY =
      event.clientY - metrics.containerRect.top;

    const newX =
      ((cursorX - metrics.offsetX) /
      metrics.displayedWidth) *
    100;

    const newY =
      ((cursorY - metrics.offsetY) /
      metrics.displayedHeight) *
    100;

    restoredPlant.inTrash = false;
    restoredPlant.stickerX = Number(
      Math.max(0, Math.min(100, newX)).toFixed(1)
    );

    restoredPlant.stickerY = Number(
      Math.max(0, Math.min(100, newY)).toFixed(1)
    );

    savePlantToFirebase(restoredPlant);

    renderTrashDrawer();
    applyEditModeView();
    positionMarkers();
    openStickerEditControls(event, restoredPlant);

    return;
  }

  if ((!movingPlant && !movingDot) || !editingPlant) {
    return;
  }

  if (movingPlant && isPointerOverTrash(event)) {
    moveEditingStickerToTrash();
    return;
  }

  setTrashDragHighlight(false);

  if (movingDot) {
    ignoreNextMarkerClick = true;
  }

  movingPlant = false;
  movingDot = false;

  savePlantToFirebase(editingPlant);
  positionMarkers();
  positionEditControlsAbovePlant(editingPlant);
});
